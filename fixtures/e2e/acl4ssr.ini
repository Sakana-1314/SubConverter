; ACL4SSR-style acceptance config (real subset of the format, SPEC §8).
; Used by scripts/acceptance.ts via config=inline:<base64url>.
[common]
foo=bar

[custom]
custom_proxy_group=PROXY`select`.*
custom_proxy_group=AUTO`url-test`.*`https://www.gstatic.com/generate_204`300,50
custom_proxy_group=Fallback`fallback`[]DIRECT`.*`https://example.com/generate_204`600
custom_proxy_group=LB`load-balance`!!TYPE=^SS$`https://example.com/generate_204`300,10
ruleset=PROXY,[]DOMAIN-SUFFIX,example.org
ruleset=PROXY,[]DOMAIN-KEYWORD,example
ruleset=DIRECT,[]DOMAIN,ads.example.com
rename=^SS Node@SS Renamed
clash_rule_base=base/all_base.tpl
emoji=true
